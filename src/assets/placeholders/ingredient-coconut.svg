<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 500 500" width="100%" height="100%">
  <defs>
    <radialGradient id="coconutBg" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#F1F8F2"/>
      <stop offset="100%" stop-color="#DDECDD"/>
    </radialGradient>
    <linearGradient id="pureOil" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#FFFFFF"/>
      <stop offset="60%" stop-color="#E8F5E9"/>
      <stop offset="100%" stop-color="#C8E6C9"/>
    </linearGradient>
  </defs>
  <rect width="500" height="500" rx="24" fill="url(#coconutBg)"/>
  
  <!-- Halved Coconut Illustration -->
  <g transform="translate(130, 90)">
    <!-- Husk Outer -->
    <circle cx="120" cy="120" r="120" fill="#4E342E"/>
    <circle cx="120" cy="120" r="108" fill="#6D4C41"/>
    <!-- Fresh White Meat -->
    <circle cx="120" cy="120" r="92" fill="#FFFFFF"/>
    <circle cx="120" cy="120" r="65" fill="#F1F8E9"/>
    <!-- Coconut Water Shimmer -->
    <ellipse cx="120" cy="120" rx="45" ry="30" fill="#E0F2F1" opacity="0.7"/>
  </g>

  <!-- Palm Leaf Decoration -->
  <g opacity="0.3" transform="translate(40, 40) rotate(-25)">
    <path d="M0 0 C40 -50 120 -30 160 30 C110 70 50 30 0 0 Z" fill="#2E7D32"/>
  </g>

  <!-- Pure Coconut Oil Drop -->
  <g transform="translate(360, 310)">
    <path d="M0 -40 C25 0 35 25 35 45 C35 70 20 90 0 90 C-20 90 -35 70 -35 45 C-35 25 -25 0 0 -40 Z" fill="url(#pureOil)" stroke="#81C784" stroke-width="2"/>
    <ellipse cx="-10" cy="40" rx="6" ry="15" fill="#FFFFFF" opacity="0.9"/>
  </g>

  <!-- Badge text -->
  <rect x="50" y="420" width="400" height="48" rx="24" fill="#2E7D32"/>
  <text x="250" y="450" font-family="Poppins, sans-serif" font-weight="600" font-size="16" fill="#FFFFFF" text-anchor="middle">Lauric Acid &amp; Dưỡng Ẩm Chuyên Sâu</text>
</svg>
