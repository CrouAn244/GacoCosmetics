  <rect x="285" y="180" width="30" height="40" rx="5" fill="#E86A33"/>

  <rect x="50" y="520" width="500" height="40" rx="20" fill="#FFFFFF" opacity="0.9"/>
  <text x="300" y="546" font-family="Inter" font-weight="600" font-size="14" fill="#2E7D32" text-anchor="middle">Bộ đôi nông sản vàng: Gấc mọng &amp; Dừa Bến Tre</text>
