  <circle cx="420" cy="280" r="95" fill="#E65100"/>
  <circle cx="420" cy="280" r="80" fill="#FFB74D"/>
  <circle cx="400" cy="260" r="25" fill="#C62828"/>
  <circle cx="445" cy="290" r="28" fill="#C62828"/>
  <circle cx="410" cy="310" r="26" fill="#C62828"/>

