<!-- Gallery 5: Combo 2 Tubes with Gift Box -->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 600" width="100%" height="100%">
  <rect width="600" height="600" rx="24" fill="#FBF5EE"/>
  
  <!-- Combo Box Base -->
  <rect x="120" y="100" width="360" height="380" rx="20" fill="#D7B899" stroke="#B89472" stroke-width="4"/>
  <rect x="140" y="120" width="320" height="340" rx="14" fill="#FFF9F5"/>

  <!-- Left Tube -->
  <g transform="translate(240, 200) rotate(-8)">
    <rect x="-18" y="0" width="36" height="180" rx="6" fill="#FFFFFF" stroke="#EAD8C7" stroke-width="2"/>
    <rect x="-18" y="40" width="36" height="70" fill="#FFF2EB"/>
    <text x="0" y="80" font-family="Poppins" font-size="10" font-weight="bold" fill="#E86A33" text-anchor="middle">GACO</text>
  </g>

  <!-- Right Tube -->
  <g transform="translate(360, 200) rotate(8)">
    <rect x="-18" y="0" width="36" height="180" rx="6" fill="#FFFFFF" stroke="#EAD8C7" stroke-width="2"/>
    <rect x="-18" y="40" width="36" height="70" fill="#EAF3EB"/>
    <text x="0" y="80" font-family="Poppins" font-size="10" font-weight="bold" fill="#2E7D32" text-anchor="middle">GACO</text>
  </g>

  <!-- Special Tag Ribbon -->
  <path d="M120 160 L240 160 L220 200 L120 200 Z" fill="#E86A33"/>
  <text x="170" y="186" font-family="Inter" font-weight="bold" font-size="13" fill="#FFFFFF" text-anchor="middle">COMBO 149K</text>

  <rect x="50" y="520" width="500" height="40" rx="20" fill="#FFFFFF" opacity="0.9"/>
  <text x="300" y="546" font-family="Inter" font-weight="600" font-size="14" fill="#E86A33" text-anchor="middle">Combo 2 thỏi tiết kiệm + Tặng cẩm nang chăm sóc môi</text>
</svg>
