<!-- Gallery 4: Before / After Lip Effect -->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 600" width="100%" height="100%">
  <rect width="600" height="600" rx="24" fill="#FFF8F2"/>
  
  <!-- Left Side: Before (Dry, pale/discolored) -->
  <rect x="40" y="80" width="250" height="380" rx="16" fill="#F5E8DE"/>
  <text x="165" y="130" font-family="Poppins" font-weight="700" font-size="18" fill="#8D6E63" text-anchor="middle">TRƯỚC KHI DÙNG</text>
  <!-- Dry lips -->
  <g transform="translate(165, 260)">
    <path d="M-60 0 C-30 -20 30 -20 60 0 C30 25 -30 25 -60 0 Z" fill="#D7CCC8"/>
    <path d="M-50 0 C-20 10 20 10 50 0" stroke="#8D6E63" stroke-width="2"/>
    <!-- dry cracks -->
    <line x1="-20" y1="-10" x2="-18" y2="10" stroke="#BCAAA4" stroke-width="1.5"/>
    <line x1="5" y1="-8" x2="7" y2="12" stroke="#BCAAA4" stroke-width="1.5"/>
  </g>
  <text x="165" y="400" font-family="Inter" font-size="13" fill="#6D4C41" text-anchor="middle">Môi khô ráp, bong tróc</text>
  <text x="165" y="425" font-family="Inter" font-size="13" fill="#6D4C41" text-anchor="middle">Rãnh môi sâu, sắc môi thâm</text>

  <!-- Right Side: After (Naturally rosy, moisturized) -->
  <rect x="310" y="80" width="250" height="380" rx="16" fill="#FBE9E7"/>
  <text x="435" y="130" font-family="Poppins" font-weight="700" font-size="18" fill="#E86A33" text-anchor="middle">SAU 14 NGÀY DÙNG</text>
  <!-- Rosy plump lips -->
  <g transform="translate(435, 260)">
    <path d="M-65 0 C-30 -28 30 -28 65 0 C30 35 -30 35 -65 0 Z" fill="#FF8A65"/>
    <ellipse cx="0" cy="8" rx="35" ry="12" fill="#FFAB91"/>
    <!-- Shimmer gloss highlights -->
    <ellipse cx="-15" cy="4" rx="8" ry="4" fill="#FFFFFF" opacity="0.8"/>
    <ellipse cx="18" cy="6" rx="10" ry="5" fill="#FFFFFF" opacity="0.8"/>
  </g>
  <text x="435" y="400" font-family="Inter" font-weight="600" font-size="13" fill="#E86A33" text-anchor="middle">Môi ẩm mượt, căng mọng</text>
  <text x="435" y="425" font-family="Inter" font-weight="600" font-size="13" fill="#2E7D32" text-anchor="middle">Ửng hồng tự nhiên từ Gấc</text>

  <rect x="50" y="520" width="500" height="40" rx="20" fill="#FFFFFF" opacity="0.9"/>
  <text x="300" y="546" font-family="Inter" font-weight="600" font-size="14" fill="#E86A33" text-anchor="middle">Hiệu quả kiểm chứng sau 14 ngày sử dụng đều đặn</text>
</svg>
