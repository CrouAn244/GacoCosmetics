<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 700" width="100%" height="100%">
  <defs>
    <radialGradient id="kraftBg" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#FFFDF9"/>
      <stop offset="70%" stop-color="#F7EDE3"/>
      <stop offset="100%" stop-color="#EEDAC8"/>
    </radialGradient>
    <linearGradient id="gacGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FF5722"/>
      <stop offset="60%" stop-color="#E86A33"/>
      <stop offset="100%" stop-color="#C0392B"/>
    </linearGradient>
    <linearGradient id="balmBody" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#FAF4ED"/>
      <stop offset="40%" stop-color="#FFFFFF"/>
      <stop offset="100%" stop-color="#EFE2D4"/>
    </linearGradient>
    <linearGradient id="waxLip" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#E65100"/>
      <stop offset="50%" stop-color="#FF7043"/>
      <stop offset="100%" stop-color="#D84315"/>
    </linearGradient>
    <filter id="softShadow" x="-20%" y="-20%" width="150%" height="150%">
      <feDropShadow dx="10" dy="25" stdDeviation="20" flood-color="#7A4B29" flood-opacity="0.18"/>
    </filter>
  </defs>

  <!-- Linen / Kraft Background Canvas -->
  <rect width="600" height="700" rx="28" fill="url(#kraftBg)"/>

  <!-- Organic Botanical Leaves in Background -->
  <g opacity="0.35" transform="translate(80, 80) rotate(-15)">
    <path d="M0 0 C40 -60 120 -50 160 20 C100 80 40 40 0 0 Z" fill="#2E7D32"/>
    <path d="M0 0 C60 10 120 15 160 20" stroke="#1B5E20" stroke-width="3" fill="none"/>
  </g>
  <g opacity="0.25" transform="translate(420, 480) rotate(45)">
    <path d="M0 0 C35 -50 100 -40 140 15 C85 65 35 30 0 0 Z" fill="#2E7D32"/>
  </g>

  <!-- Halved Gac Fruit Element (Left) -->
  <g transform="translate(110, 360) rotate(-10)" filter="url(#softShadow)">
    <!-- Spiny Outer Shell -->
    <path d="M40 100 C20 40 80 0 150 10 C220 20 270 80 250 160 C230 220 160 250 100 230 C50 210 20 160 40 100 Z" fill="#E65100"/>
    <!-- Yellow/Orange Inner Rind -->
    <path d="M55 105 C38 55 90 20 145 28 C205 37 245 88 230 150 C212 205 152 230 105 212 C65 195 38 152 55 105 Z" fill="#FFA726"/>
    <!-- Deep Red Ruby Aril / Pulp with Seeds -->
    <circle cx="110" cy="95" r="28" fill="url(#gacGradient)"/>
    <circle cx="160" cy="85" r="32" fill="url(#gacGradient)"/>
    <circle cx="185" cy="140" r="30" fill="url(#gacGradient)"/>
    <circle cx="130" cy="155" r="34" fill="url(#gacGradient)"/>
    <circle cx="90" cy="145" r="26" fill="url(#gacGradient)"/>
    <!-- Gac Seed accents -->
    <ellipse cx="112" cy="96" rx="12" ry="7" fill="#871A0B"/>
    <ellipse cx="162" cy="86" rx="14" ry="8" fill="#871A0B"/>
    <ellipse cx="186" cy="142" rx="13" ry="8" fill="#871A0B"/>
    <ellipse cx="132" cy="157" rx="15" ry="9" fill="#871A0B"/>
  </g>

  <!-- Ben Tre Coconut Slice Element (Right) -->
  <g transform="translate(360, 320) rotate(15)" filter="url(#softShadow)">
    <circle cx="90" cy="90" r="85" fill="#5D4037"/>
    <circle cx="90" cy="90" r="75" fill="#8D6E63"/>
    <circle cx="90" cy="90" r="62" fill="#FFFFFF"/>
    <circle cx="90" cy="90" r="45" fill="#E0F2F1" opacity="0.3"/>
  </g>

  <!-- Central Hero Product: Gaco Lip Balm Tube at 45° -->
  <g transform="translate(300, 160) rotate(18)" filter="url(#softShadow)">
    <!-- Exposed Lip Balm Bullet / Wax -->
    <path d="M-22 -40 C-22 -85 0 -95 22 -65 L22 0 L-22 0 Z" fill="url(#waxLip)"/>
    <ellipse cx="0" cy="-65" rx="15" ry="8" fill="#FF8A65" opacity="0.6"/>

    <!-- Gold Accent Ring -->
    <rect x="-24" y="0" width="48" height="12" rx="2" fill="#D4AF37"/>

    <!-- Tube Body (Matte Eco Cream Kraft) -->
    <rect x="-25" y="12" width="50" height="210" rx="6" fill="url(#balmBody)"/>
    
    <!-- Organic Label Detail -->
    <rect x="-21" y="40" width="42" height="150" rx="4" fill="#FFFFFF"/>
    <text x="0" y="70" font-family="Poppins, sans-serif" font-weight="700" font-size="11" fill="#E86A33" text-anchor="middle" letter-spacing="2">GACO</text>
    <text x="0" y="86" font-family="Inter, sans-serif" font-weight="600" font-size="6" fill="#2E7D32" text-anchor="middle" letter-spacing="1">100% VEGAN</text>
    
    <!-- Halved Gac Icon on Label -->
    <circle cx="0" cy="115" r="14" fill="#FFF0E6"/>
    <circle cx="0" cy="115" r="10" fill="#E86A33"/>
    <circle cx="0" cy="115" r="5" fill="#C0392B"/>

    <text x="0" y="150" font-family="Inter, sans-serif" font-size="6" fill="#666" text-anchor="middle">LIP BALM</text>
    <text x="0" y="160" font-family="Inter, sans-serif" font-weight="600" font-size="5" fill="#2B2B2B" text-anchor="middle">GẤC &amp; DẦU DỪA</text>
    <text x="0" y="176" font-family="Inter, sans-serif" font-size="5" fill="#888" text-anchor="middle">5g • 0% Lead</text>

    <!-- Base Twist Wheel -->
    <rect x="-25" y="222" width="50" height="18" rx="4" fill="#D7CCC8"/>
    <line x1="-15" y1="225" x2="-15" y2="237" stroke="#A1887F" stroke-width="1"/>
    <line x1="-5" y1="225" x2="-5" y2="237" stroke="#A1887F" stroke-width="1"/>
    <line x1="5" y1="225" x2="5" y2="237" stroke="#A1887F" stroke-width="1"/>
    <line x1="15" y1="225" x2="15" y2="237" stroke="#A1887F" stroke-width="1"/>
  </g>

  <!-- Tag badge on top right -->
  <g transform="translate(430, 70)">
    <rect width="130" height="38" rx="19" fill="#2E7D32"/>
    <text x="65" y="24" font-family="Inter, sans-serif" font-size="12" font-weight="600" fill="#FFFFFF" text-anchor="middle">100% Nông Sản Việt</text>
  </g>
</svg>
