<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 500 500" width="100%" height="100%">
  <defs>
    <radialGradient id="packBg" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#FDF8F3"/>
      <stop offset="100%" stop-color="#EFE0D2"/>
    </radialGradient>
    <linearGradient id="kraftBox" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#D7B899"/>
      <stop offset="100%" stop-color="#B89472"/>
    </linearGradient>
  </defs>
  <rect width="500" height="500" rx="24" fill="url(#packBg)"/>
  
  <!-- Eco Kraft Packaging Box -->
  <g transform="translate(160, 100)">
    <!-- Box Body -->
    <rect x="0" y="40" width="180" height="280" rx="12" fill="url(#kraftBox)"/>
    <!-- Box Flap Top -->
    <polygon points="0,40 40,0 220,0 180,40" fill="#E2C9B0"/>
    <polygon points="180,40 220,0 220,240 180,280" fill="#9C7856"/>

    <!-- Kraft Texture stamp -->
    <rect x="25" y="70" width="130" height="210" rx="6" fill="#FFF8F2" opacity="0.9"/>
    <text x="90" y="110" font-family="Poppins, sans-serif" font-weight="700" font-size="16" fill="#E86A33" text-anchor="middle" letter-spacing="3">GACO</text>
    <text x="90" y="130" font-family="Inter, sans-serif" font-weight="600" font-size="8" fill="#2E7D32" text-anchor="middle">ORGANIC COSMETICS</text>
    <line x1="45" y1="145" x2="135" y2="145" stroke="#EAD8C7" stroke-width="1.5"/>
    <circle cx="90" cy="180" r="18" fill="#E86A33"/>
    <text x="90" y="225" font-family="Inter, sans-serif" font-size="8" fill="#2B2B2B" text-anchor="middle">Son Dưỡng Gấc Dầu Dừa</text>
    <text x="90" y="240" font-family="Inter, sans-serif" font-size="7" fill="#666" text-anchor="middle">Bao bì giấy tái chế 100%</text>
  </g>

  <!-- Eco Seal Badge -->
  <circle cx="390" cy="130" r="45" fill="#2E7D32"/>
  <text x="390" y="125" font-family="Inter, sans-serif" font-weight="700" font-size="10" fill="#FFFFFF" text-anchor="middle">ECO-FRIENDLY</text>
  <text x="390" y="140" font-family="Inter, sans-serif" font-size="9" fill="#C8E6C9" text-anchor="middle">Bảo Vệ Môi Trường</text>
</svg>
